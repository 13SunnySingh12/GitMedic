# Optional local database (fallback for Supabase). Host port 5433 avoids clashing with a native Postgres.
# Needs GITMEDIC_APP_PASSWORD and GITMEDIC_ML_PASSWORD in ./.env (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: gitmedic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GITMEDIC_APP_PASSWORD: ${GITMEDIC_APP_PASSWORD:?set GITMEDIC_APP_PASSWORD in .env}
      GITMEDIC_ML_PASSWORD: ${GITMEDIC_ML_PASSWORD:?set GITMEDIC_ML_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gitmedic-db:/var/lib/postgresql/data
      - ./backend/db/setup-roles.sql:/setup-roles.sql:ro
      - ./backend/db/init-local.sh:/docker-entrypoint-initdb.d/init-local.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gitmedic"]
      interval: 5s
      retries: 10

volumes:
  gitmedic-db:
